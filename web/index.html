<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D4 Builds</title>
  <meta name="description" content="Diablo IV builds: your farm list, and every guide for a skill – or build it yourself">
  <link rel="stylesheet" href="/renderer/style.css">
  <link rel="stylesheet" href="/web/web.css">
</head>
<body>
<div id="app" class="web">
  <header id="wtop">
    <b class="brand">D4 Builds</b>
    <div class="seg bswitch" id="wtabs">
      <button data-s="farm" title="Your farm list">My builds</button>
      <button data-s="builder" title="Pick a class and a skill – every guide for it, or build it yourself">Find a build</button>
    </div>
    <span class="sp"></span>
    <button id="wsync" class="tbtn" title="Your builds are saved under this device's code – take them to another device with it">Device code</button>
  </header>
  <section id="panel">
    <div id="cols"><div id="main"></div></div>
    <footer id="status"><span id="stData"></span></footer>
  </section>
</div>
<script src="/web/api.js"></script>
<script src="/renderer/cards.js"></script>
<script src="/renderer/guide.js"></script>
<script src="/renderer/farm.js"></script>
<script src="/renderer/buildviews.js"></script>
<script src="/renderer/compare.js"></script>
<script src="/lib/dmgmodel.js"></script>
<script src="/lib/optimizer.js"></script>
<script src="/renderer/builder.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
